version: '3.8'

services:
  # Service pour l'application Laravel + Vue.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    ports:
      - "8000:8000"   # Rendre le port 8000 de l'application accessible
    volumes:
      - .:/var/www/html # Monter le dossier local à /var/www/html dans le conteneur
    networks:
      - app-network
    depends_on:
      - db  # L'application dépend de la base de données
  
  # Service pour la base de données MySQL
  db:
    image: mysql:5.7
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Mot de passe root pour MySQL
      MYSQL_DATABASE: laravel_db         # Nom de la base de données
      MYSQL_USER: laravel_user           # Nom d'utilisateur MySQL
      MYSQL_PASSWORD: userpassword      # Mot de passe utilisateur
    ports:
      - "3306:3306"   # Lier le port 3306 pour la base de données
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql  # Persistance des données de la base de données

  # Service pour gérer le serveur web (Nginx par exemple, si nécessaire)
  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - app

# Réseau pour connecter les services
networks:
  app-network:
    driver: bridge

# Volume pour persister les données de la base de données
volumes:
  db-data:
